<header class="flex justify-between bg-linear-to-r to-blue-950 top-0 w-full fixed p-4 px-6 h-20">
    <div class="flex align-middle items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="flex size-6">
            <path
                d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a3.375 3.375 0 1 1 6.75 0 3.375 3.375 0 0 1-6.75 0ZM1.5 19.125a7.125 7.125 0 0 1 14.25 0v.003l-.001.119a.75.75 0 0 1-.363.63 13.067 13.067 0 0 1-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 0 1-.364-.63l-.001-.122ZM17.25 19.128l-.001.144a2.25 2.25 0 0 1-.233.96 10.088 10.088 0 0 0 5.06-1.01.75.75 0 0 0 .42-.643 4.875 4.875 0 0 0-6.957-4.611 8.586 8.586 0 0 1 1.71 5.157v.003Z" />
        </svg>
        <a class="flex text-2xl uppercase font-bold border-r pr-5">DATING APP</a>
        <nav class="flex align-middle items-center gap-10 px-6 uppercase text-lg">
            <a>Matches</a>
            <a>Lists</a>
            <a>Messages</a>
        </nav>
    </div>
    <div class="flex align-middle items-center min-w-fit">
        @if (accountService.currentUser(); as user) {
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="flex items-center text-white text-xl gap-3 cursor-pointer">
                <img src="/user.png" alt="user avatar" class="rounded-full w-8 h-8">
                <span>{{user.displayName}}</span>
            </div>
            <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                <li><a>Edit profile</a></li>
                <li><a (click)="logout()">Logout</a></li>
            </ul>
        </div>
        }
        @else {
        <form #loginForm="ngForm" (ngSubmit)="login()" class="flex items-center gap-2">
            <input [(ngModel)]="creds.email" name="email" type="text" class="input h-10" placeholder="Email">
            <input [(ngModel)]="creds.password" name="password" type="password" class="input h-10" placeholder="Password">
            <button type="submit" class="btn btn-ghost h-10">Login</button>
        </form>
        }
    </div>
</header>
